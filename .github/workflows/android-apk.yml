name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android/TWBoardingScanner/**
      - .github/workflows/android-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install fixed beta debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp android/TWBoardingScanner/signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | head -8

      - name: Prepare v0.4.18 project
        run: |
          rm -rf _android_build
          mkdir -p _android_build
          unzip -q android/TWBoardingScanner/TWBoardingScanner_Android_v02_source.zip -d _android_build
          cp -R android/TWBoardingScanner/v04-overlay/. _android_build/TWBoardingScanner_Android_v02/
          mkdir -p _android_build/TWBoardingScanner_Android_v02/signing
          cp android/TWBoardingScanner/signing/debug.keystore _android_build/TWBoardingScanner_Android_v02/signing/debug.keystore
          rm -f _android_build/TWBoardingScanner_Android_v02/app/src/main/java/com/rex/twboardingscanner/data/DemoDataProvider.kt
          grep -n "versionCode\|versionName" _android_build/TWBoardingScanner_Android_v02/app/build.gradle.kts

      - name: Build APK
        working-directory: _android_build/TWBoardingScanner_Android_v02
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-previews
          path: _android_build/TWBoardingScanner_Android_v02/app/build/ui-previews/*.png
          if-no-files-found: ignore

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-diagnostics
          path: _android_build/TWBoardingScanner_Android_v02/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Prepare and verify APK
        shell: bash
        run: |
          cp _android_build/TWBoardingScanner_Android_v02/app/build/outputs/apk/debug/app-debug.apk TWBoardingScanner-latest.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs TWBoardingScanner-latest.apk
          EXPECTED_CERT="60704cfc2efe84748087d8beaf66be317e6ad1b273030c7c08ac27773d6582fe"
          ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs TWBoardingScanner-latest.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TWBoardingScanner-latest.apk | head -8
          ls -lh TWBoardingScanner-latest.apk
          sha256sum TWBoardingScanner-latest.apk
          cp TWBoardingScanner-latest.apk TWBoardingScanner-v0.4.18.apk
          zip -q TWBoardingScanner-v0.4.18.zip TWBoardingScanner-v0.4.18.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWBoardingScanner-APK
          path: TWBoardingScanner-latest.apk
          if-no-files-found: error

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-android --cleanup-tag -y || true
          gh release create latest-android TWBoardingScanner-latest.apk TWBoardingScanner-v0.4.18.apk TWBoardingScanner-v0.4.18.zip             --target "${GITHUB_SHA}"             --title "台股上車掃描器 Android 最新版"             --notes "v0.4.18：每日買賣紀錄可展開個股，顯示股號股名、原買入批次、含費成本價、賣出價、淨利與報酬率；新增日漲跌金額與百分比、買賣價差。支援每日翻頁及逐筆CSV匯出，舊紀錄缺價格時明確標示。可直接覆蓋固定簽章的v0.4.17。"             --latest
