name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android/TWBoardingScanner/**
      - .github/workflows/android-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install fixed beta debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp android/TWBoardingScanner/signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | head -8

      - name: Prepare Android project
        run: |
          rm -rf _android_build
          mkdir -p _android_build
          unzip -q android/TWBoardingScanner/TWBoardingScanner_Android_v02_source.zip -d _android_build
          cp -R android/TWBoardingScanner/v04-overlay/. _android_build/TWBoardingScanner_Android_v02/
          mkdir -p _android_build/TWBoardingScanner_Android_v02/signing
          cp android/TWBoardingScanner/signing/debug.keystore _android_build/TWBoardingScanner_Android_v02/signing/debug.keystore
          rm -f _android_build/TWBoardingScanner_Android_v02/app/src/main/java/com/rex/twboardingscanner/data/DemoDataProvider.kt
          grep -n "versionCode\|versionName" _android_build/TWBoardingScanner_Android_v02/app/build.gradle.kts

      - name: Build APK
        working-directory: _android_build/TWBoardingScanner_Android_v02
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-previews
          path: _android_build/TWBoardingScanner_Android_v02/app/build/ui-previews/*.png
          if-no-files-found: ignore

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-diagnostics
          path: _android_build/TWBoardingScanner_Android_v02/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Prepare and verify APK
        shell: bash
        run: |
          cp _android_build/TWBoardingScanner_Android_v02/app/build/outputs/apk/debug/app-debug.apk TWBoardingScanner-latest.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs TWBoardingScanner-latest.apk
          EXPECTED_CERT="60704cfc2efe84748087d8beaf66be317e6ad1b273030c7c08ac27773d6582fe"
          ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs TWBoardingScanner-latest.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TWBoardingScanner-latest.apk | head -8
          ls -lh TWBoardingScanner-latest.apk
          sha256sum TWBoardingScanner-latest.apk
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/TWBoardingScanner/v04-overlay/app/build.gradle.kts)
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp TWBoardingScanner-latest.apk "TWBoardingScanner-v$VERSION.apk"
          zip -q "TWBoardingScanner-v$VERSION.zip" "TWBoardingScanner-v$VERSION.apk"
          python3 android/TWBoardingScanner/write_update_manifest.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWBoardingScanner-APK
          path: |
            TWBoardingScanner-latest.apk
            android-update.json
          if-no-files-found: error

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="android-v$ANDROID_VERSION"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "TWBoardingScanner-v$ANDROID_VERSION.apk" "TWBoardingScanner-v$ANDROID_VERSION.zip" android-update.json --clobber
            gh release edit "$VERSION_TAG" --notes-file android-update-notes.txt
          else
            gh release create "$VERSION_TAG" "TWBoardingScanner-v$ANDROID_VERSION.apk" "TWBoardingScanner-v$ANDROID_VERSION.zip" android-update.json --target "${GITHUB_SHA}" --title "AI-離職神器 v$ANDROID_VERSION" --notes-file android-update-notes.txt --latest=false
          fi
          gh release delete latest-android --cleanup-tag -y || true
          gh release create latest-android TWBoardingScanner-latest.apk "TWBoardingScanner-v$ANDROID_VERSION.apk" "TWBoardingScanner-v$ANDROID_VERSION.zip" android-update.json --target "${GITHUB_SHA}" --title "AI-離職神器 Android 最新版" --notes-file android-update-notes.txt --latest

      - name: Verify public update feed and APK
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 "https://github.com/rex0966445518/stock-monitor-updates/releases/download/latest-android/android-update.json?build=${GITHUB_RUN_ID}" --output public-android-update.json
          cmp android-update.json public-android-update.json
          APK_URL=$(python3 -c 'import json; print(json.load(open("public-android-update.json"))["url"])')
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 "$APK_URL" --output public-update.apk
          python3 -c 'import json,hashlib,pathlib; m=json.load(open("public-android-update.json")); b=pathlib.Path("public-update.apk").read_bytes(); assert len(b)==m["size"] and hashlib.sha256(b).hexdigest()==m["sha256"]; print("Public updater feed and APK verified")'
