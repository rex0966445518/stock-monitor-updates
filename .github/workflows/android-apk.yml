name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - android/TWBoardingScanner/**
      - .github/workflows/android-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install fixed beta debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp android/TWBoardingScanner/signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | head -8

      - name: Prepare v0.4.4 project
        run: |
          rm -rf _android_build
          mkdir -p _android_build
          unzip -q android/TWBoardingScanner/TWBoardingScanner_Android_v02_source.zip -d _android_build
          cp -R android/TWBoardingScanner/v04-overlay/. _android_build/TWBoardingScanner_Android_v02/
          rm -f _android_build/TWBoardingScanner_Android_v02/app/src/main/java/com/rex/twboardingscanner/data/DemoDataProvider.kt
          grep -n "versionCode\|versionName" _android_build/TWBoardingScanner_Android_v02/app/build.gradle.kts

      - name: Build APK
        working-directory: _android_build/TWBoardingScanner_Android_v02
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare and verify APK
        shell: bash
        run: |
          cp _android_build/TWBoardingScanner_Android_v02/app/build/outputs/apk/debug/app-debug.apk TWBoardingScanner-latest.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs TWBoardingScanner-latest.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TWBoardingScanner-latest.apk | head -8
          ls -lh TWBoardingScanner-latest.apk
          sha256sum TWBoardingScanner-latest.apk
          cp TWBoardingScanner-latest.apk TWBoardingScanner-v0.4.4.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWBoardingScanner-APK
          path: TWBoardingScanner-latest.apk
          if-no-files-found: error

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-android --cleanup-tag -y || true
          gh release create latest-android TWBoardingScanner-latest.apk TWBoardingScanner-v0.4.4.apk             --target "${GITHUB_SHA}"             --title "台股上車掃描器 Android 最新版"             --notes "v0.4.4：全新ABC精確規則、分區時點、B技術升級、額外查核及待查核狀態；舊規則設定已重置。固定 Beta 簽章。"             --latest
