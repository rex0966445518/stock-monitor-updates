name: Publish LearningIsland Family TV 3.0.8
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-308.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.0.8.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.0.7.apk release-staging/family-308/tv.zst -o "$apk"
          echo "1ff7df0fa5cafb26c16dd0efd856c82b0c292f7957d03c873950bb5b1897fd6c  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 308
          cp release-staging/family-308/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.0.8 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.0.8 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.0.8" --notes "修正家庭乘員容量與節能遇襲，新增船體損傷、維修與每日登入效果。"
