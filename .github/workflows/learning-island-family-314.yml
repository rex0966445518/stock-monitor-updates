name: Publish LearningIsland Family TV 3.1.4
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-314.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.1.4.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.1.3.apk release-staging/family-314/tv.zst -o "$apk"
          echo "d38bf93438b868504bc97f60e2a779f180c89ec608a682b47ce78797e42b8746  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 314
          cp release-staging/family-314/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.1.4 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.1.4 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.1.4" --notes "修正太空探索啟動畫面尺寸與舊版電視相容性，加入載入錯誤提示。"
