name: Publish LearningIsland Family TV 3.0.9
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-309.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.0.9.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.0.8.apk release-staging/family-309/tv.zst -o "$apk"
          echo "ffbffeb845c0d214f83c8afd873d2c4a9e2555487ed5b876a447fb75f30583e8  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 309
          cp release-staging/family-309/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.0.9 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.0.9 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.0.9" --notes "完整飛船機庫與客艙、推進、搜索及飛彈模組商店。"
