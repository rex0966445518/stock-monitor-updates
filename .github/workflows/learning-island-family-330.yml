name: Publish LearningIsland Family TV 3.3.0
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-330.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.3.0.apk
          cat release-staging/family-330/part* > /tmp/tv.zst
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.2.9.apk /tmp/tv.zst -o "$apk"
          echo "e4917330480794ad76c94504e1f679725a70ac326ed16d753851b863fb791966  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 330
          cp release-staging/family-330/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.3.0 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.3.0 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.3.0" --notes "下載分段寫入、顯示驗證進度，完成後直接開啟安裝，可重試。"
