name: Build NineMonitor Windows
on:
  push:
    branches: ['ninemonitor/**']
    paths: ['windows/NineMonitor/**', '.github/workflows/ninemonitor-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ninemonitor-windows
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
        working-directory: windows/NineMonitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test core and updater
        run: |
          & .\tests\Core.Tests.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Test color masks and OCR
        run: '& .\tests\Native.Tests.ps1'
      - name: Smoke test Windows UI
        run: |
          & .\Monitor.ps1 -SmokeTest
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'UI smoke failed' }
      - name: Install compiler and build EXE
        run: |
          python -m pip install ziglang==0.17.0
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' }
          python build/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Native EXE build failed' }
      - name: Test actual EXE installation and launch
        timeout-minutes: 3
        run: |
          $env:NM_CI_TEST = '1'
          $p = Start-Process -FilePath .\dist\NineMonitor-Setup.exe -ArgumentList '/SILENT /NOLAUNCH' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'NineMonitor\App\NineMonitor.exe'
          if (!(Test-Path $app)) { throw 'Installed app EXE missing' }
          $p = Start-Process -FilePath $app -ArgumentList '/SMOKE' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed launcher failed: $($p.ExitCode)" }
          $prefs = Join-Path $env:LOCALAPPDATA 'NineMonitor\Data\threecolor-settings.json'
          if (!(Test-Path $prefs)) { throw 'GUI did not save settings' }
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NineMonitor-Windows
          path: |
            windows/NineMonitor/dist/NineMonitor-Setup.exe
            windows/NineMonitor/dist/ninemonitor-update.json
            windows/NineMonitor/dist/SHA256SUMS.txt
      - name: Publish dedicated update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "ninemonitor-v$v"
          $exists = $false
          try { $null = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"; $exists = $true } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if ($exists) { throw "Version already published. Increment version.json before releasing again." }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "三色數值監視器 v$v" --notes '三色同步門檻、語音提醒、EXE 安裝與專屬一鍵更新。核心、UI 與安裝器測試已執行；請在實際目標畫面先做辨識測試。' --prerelease --latest=false dist/NineMonitor-Setup.exe dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Version release failed' }
          $channelExists = $false
          try { $null = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/ninemonitor-latest"; $channelExists = $true } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (!$channelExists) {
            gh release create ninemonitor-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '三色數值監視器：固定下載與更新通道' --notes '專屬更新通道；不取代其他軟體的 latest。' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Update channel creation failed' }
          }
          gh release upload ninemonitor-latest --repo $env:GITHUB_REPOSITORY --clobber dist/NineMonitor-Setup.exe dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Channel installer upload failed' }
          gh release upload ninemonitor-latest --repo $env:GITHUB_REPOSITORY --clobber dist/ninemonitor-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest publication failed' }
