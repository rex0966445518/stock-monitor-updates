name: Build NineMonitor Windows
on:
  push:
    branches: ['ninemonitor/**']
    paths: ['windows/NineMonitor/**', '.github/workflows/ninemonitor-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ninemonitor-windows
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[publish-validated]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
        working-directory: windows/NineMonitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test core and updater
        run: |
          & .\tests\Core.Tests.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Core tests failed' }
      - name: Test color masks and OCR
        run: '& .\tests\Native.Tests.ps1'
      - name: Test automatic right-arrow cadence and stop behavior
        run: '& .\tests\AutoRight.Tests.ps1'
      - name: Smoke test Windows UI
        run: |
          & .\Monitor.ps1 -SmokeTest
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'UI smoke failed' }
      - name: Verify Unicode Windows shortcuts
        run: |
          Add-Type -TypeDefinition (Get-Content SetupShell.cs -Raw -Encoding UTF8)
          $folder = Join-Path $env:TEMP 'NM3-Shortcut-Test'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $link = Join-Path $folder '三色數值監視器.lnk'
          [NineMonitor.SetupShell]::Create($link, "$env:WINDIR\System32\notepad.exe", $env:WINDIR)
          if (!(Test-Path $link)) { throw 'Unicode shortcut was not created' }
      - name: Install compiler and build EXE
        run: |
          python -m pip install ziglang==0.16.0
          if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' }
          python build/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Native EXE build failed' }
      - name: Test actual EXE installation and launch
        timeout-minutes: 3
        run: |
          $env:NM_CI_TEST = '1'
          $p = Start-Process -FilePath .\dist\NineMonitor-Setup.exe -ArgumentList '/SILENT /NOLAUNCH' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\NineMonitor\Data\installer-native.log" -ErrorAction SilentlyContinue
            throw "Installer failed: $($p.ExitCode)"
          }
          $app = Join-Path $env:LOCALAPPDATA 'NineMonitor\App\NineMonitor.exe'
          if (!(Test-Path $app)) { throw 'Installed app EXE missing' }
          $p = Start-Process -FilePath $app -ArgumentList '/SMOKE' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\NineMonitor\Data\app-launch.log" -ErrorAction SilentlyContinue
            throw "Installed launcher failed: $($p.ExitCode)"
          }
          $prefs = Join-Path $env:LOCALAPPDATA 'NineMonitor\Data\threecolor-settings.json'
          if (!(Test-Path $prefs)) { throw 'GUI did not save settings' }
          $saved = Get-Content $prefs -Raw | ConvertFrom-Json
          $saved.Channels.Orange.Threshold = 88.25
          $saved | ConvertTo-Json -Depth 8 | Set-Content $prefs -Encoding UTF8
          $sentinel = Join-Path $env:LOCALAPPDATA 'NineMonitor\Data\history-preservation-test.txt'
          Set-Content $sentinel 'Preserve history on update' -Encoding UTF8
          $p = Start-Process -FilePath .\dist\NineMonitor-Setup.exe -ArgumentList '/UPDATE /NOLAUNCH' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\NineMonitor\Data\installer-native.log" -ErrorAction SilentlyContinue
            throw 'Update installation failed'
          }
          $p = Start-Process -FilePath $app -ArgumentList '/SMOKE' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Updated app failed to launch' }
          if ((Get-Content $prefs -Raw | ConvertFrom-Json).Channels.Orange.Threshold -ne 88.25) { throw 'Update lost settings' }
          if (!(Test-Path $sentinel)) { throw 'Update lost history' }
          Write-Host 'EXE install, launch, upgrade and data preservation passed' 
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NineMonitor-Windows
          path: |
            windows/NineMonitor/dist/NineMonitor-Setup.exe
            windows/NineMonitor/dist/ninemonitor-update.json
            windows/NineMonitor/dist/SHA256SUMS.txt
      - name: Publish dedicated update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "ninemonitor-v$v"
          $exists = $false
          try { $null = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"; $exists = $true } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if ($exists) { throw "Version already published. Increment version.json before releasing again." }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "三色數值監視器 v$v" --notes '新增每秒 5 次向右連按、連續三色辨識與紀錄、3 秒選目標、ESC 與焦點切換停止。升級保留設定與歷史。先在實際畫面測試辨識及目標程式對右鍵的反應。' --prerelease '--latest=false' dist/NineMonitor-Setup.exe dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Version release failed' }
          $channelExists = $false
          try { $null = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/ninemonitor-latest"; $channelExists = $true } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (!$channelExists) {
            gh release create ninemonitor-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '三色數值監視器：固定下載與更新通道' --notes '專屬更新通道；不取代其他軟體的 latest。' --prerelease '--latest=false'
            if ($LASTEXITCODE -ne 0) { throw 'Update channel creation failed' }
          }
          gh release upload ninemonitor-latest --repo $env:GITHUB_REPOSITORY --clobber dist/NineMonitor-Setup.exe dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Channel installer upload failed' }
          gh release upload ninemonitor-latest --repo $env:GITHUB_REPOSITORY --clobber dist/ninemonitor-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest publication failed' }
      - name: Verify live one-click update download
        timeout-minutes: 3
        run: |
          $ready = $false
          for ($i = 0; $i -lt 3; $i++) {
            $result = & .\UpdateWorker.ps1 '0.1.0' (Join-Path (Get-Location) 'Core.psm1')
            if ($result.State -eq 'Ready') {
              if (!(Test-Path $result.Path)) { throw 'Update download missing' }
              Write-Host ('Live update download and hash verification passed: ' + $result.Version)
              Remove-Item -LiteralPath $result.Path -Force
              $ready = $true
              break
            }
            Write-Host $result.Error
            Start-Sleep -Seconds 5
          }
          if (!$ready) { throw 'Published update channel could not be verified' }
