name: Publish LearningIsland Family TV 3.0.4
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-304.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.0.4.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.0.3.apk release-staging/family-304/tv.zst -o "$apk"
          echo "cf130c763511c83d2d9b92883ecb29a543f7a0bdf0af63de5bcbd3e99fba61ed  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 304
          cp release-staging/family-304/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.0.4 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.0.4 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.0.4" --notes "更新吳嘟嘟駕駛艙與全套太空探索介面。"
