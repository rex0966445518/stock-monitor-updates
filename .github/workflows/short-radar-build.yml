name: Short Radar APK build and verify
on:
  workflow_dispatch:
  push:
    branches: ['short-radar-v0.2.0']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android --no-daemon clean assembleDebug
      - name: Verify signature and identity
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "name='tw.radar.shortscan'" apk-badging.txt
          grep -F "versionName='0.2.0'" apk-badging.txt
          cp "$APK" ShortRadar-v0.2.0-debug.apk
          sha256sum ShortRadar-v0.2.0-debug.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: short-radar-v0.2.0-debug-verified
          path: |
            ShortRadar-v0.2.0-debug.apk
            SHA256.txt
            apk-badging.txt
      - name: Publish verified test APK
        if: github.ref == 'refs/heads/short-radar-v0.2.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=short-radar-v0.2.0-test
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Test release already exists; do not replace its signing identity."
            exit 1
          fi
          gh release create "$TAG" ShortRadar-v0.2.0-debug.apk SHA256.txt apk-badging.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "盤中做空雷達 v0.2.0 測試版" --notes "已通過編譯及 APK 簽章檢查的 debug 測試版。預設模擬模式；正式富邦行情需另行部署後端並授權。未完成真機、實盤與延遲驗收。此版簽章不保證能直接升級至後續版本。" --prerelease --latest=false
