name: Short Radar v0.3.2 build and publish
on:
  workflow_dispatch:
  push:
    branches: ['short-radar-v0.3.2']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests for public-data screening
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Build APK (fixed signing required)
        env:
          KEYSTORE_B64: ${{ secrets.SHORT_RADAR_KEYSTORE_B64 }}
          RADAR_SIGN_PASSWORD: ${{ secrets.SHORT_RADAR_STORE_PASSWORD }}
          RADAR_SIGN_ALIAS: ${{ secrets.SHORT_RADAR_KEY_ALIAS }}
          RADAR_KEY_PASSWORD: ${{ secrets.SHORT_RADAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 RADAR_SIGN_PASSWORD RADAR_SIGN_ALIAS RADAR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Fixed signing has not been configured. No APK will be published."
              exit 1
            fi
          done
          umask 077
          export RADAR_SIGN_PATH="$RUNNER_TEMP/short-radar.jks"
          trap 'rm -f "$RADAR_SIGN_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RADAR_SIGN_PATH"
          gradle -p android --no-daemon clean assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk ShortRadar-v0.3.2.apk
          echo "SIGN_MODE=persistent" >> "$GITHUB_ENV"
      - name: Verify APK
        env:
          EXPECTED_CERT: ${{ secrets.SHORT_RADAR_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs ShortRadar-v0.3.2.apk | tee signing-info.txt
          test -n "$EXPECTED_CERT" || { echo "::error::Missing pinned signing certificate"; exit 1; }
          ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing-info.txt)
          test "${ACTUAL_CERT,,}" = "${EXPECTED_CERT,,}" || { echo "::error::Certificate mismatch; publication blocked"; exit 1; }
          "$BT/aapt" dump badging ShortRadar-v0.3.2.apk > apk-badging.txt
          grep -F "name='tw.radar.shortscan'" apk-badging.txt
          grep -F "versionName='0.3.2'" apk-badging.txt
          sha256sum ShortRadar-v0.3.2.apk > SHA256.txt
          echo "$SIGN_MODE" > signing-mode.txt
      - uses: actions/upload-artifact@v4
        with:
          name: short-radar-v0.3.2-verified
          path: |
            ShortRadar-v0.3.2.apk
            SHA256.txt
            apk-badging.txt
            signing-info.txt
            signing-mode.txt
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=short-radar-v0.3.2
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release preserved; use a new version."
            exit 1
          fi
          gh release create "$TAG" ShortRadar-v0.3.2.apk SHA256.txt apk-badging.txt signing-info.txt signing-mode.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "盤中做空雷達 v0.3.2｜免後端極空掃描" --notes "Android 固定簽章驗證版；簽章模式：$SIGN_MODE。預設模擬，極空掃描手機直連免費官方報表；即時盤中雷達仍須後端。一鍵更新會驗證同套件、較新版本、SHA256 和同一發行憑證。本版使用固定簽章；舊 debug 版本需一次性遷移。真機與正式行情尚未驗收。" --prerelease --latest=false
