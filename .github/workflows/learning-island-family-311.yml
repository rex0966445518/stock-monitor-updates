name: Publish LearningIsland Family TV 3.1.1
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-311.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.1.1.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.1.0.apk release-staging/family-311/tv.zst -o "$apk"
          echo "b6742739b30bf192f6c99f6b53ee8fc0f503f281599fe32c1f50cc322770ffc4  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 311
          cp release-staging/family-311/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.1.1 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.1.1 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.1.1" --notes "飛船自動迎擊三種障礙，新增血條、模組射擊音效和能量石回收。"
