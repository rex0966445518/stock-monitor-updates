name: Publish LearningIsland Family TV 3.2.1
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-321.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.2.1.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.2.0.apk release-staging/family-321/tv.zst -o "$apk"
          echo "e8d1d7d87c7203e61be261c998628a1a3b302b52c89f142c1d1ab8533941649e  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 321
          cp release-staging/family-321/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.2.1 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.2.1 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.2.1" --notes "改善受損煙霧，統一商店與飛行畫面的船體、防護盾、武器與推進器圖像。"
