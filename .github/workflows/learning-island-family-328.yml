name: Publish LearningIsland Family TV 3.2.8
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-328.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.2.8.apk
          cat release-staging/family-328/part* > /tmp/tv.zst
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.2.6.apk /tmp/tv.zst -o "$apk"
          echo "a1aa7f9874b38634567895b9ef58dad865c72e171fe89c4be6c95daa10e08990  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 328
          cp release-staging/family-328/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.2.8 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.2.8 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.2.8" --notes "家長連線頁新增針對指定已配對手機重新配對。"
