name: Publish LearningIsland Family TV 3.0.6
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-306.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.0.6.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.0.5.apk release-staging/family-306/tv.zst -o "$apk"
          echo "b7a9da8b00721a14b64a989ed3089cce5d3a3346e868ba1d0d1141ffa3426f24  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 306
          cp release-staging/family-306/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.0.6 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.0.6 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.0.6" --notes "全景家庭飛船、嘟嘟搜尋動作與飛行配樂。"
