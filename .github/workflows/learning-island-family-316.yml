name: Publish LearningIsland Family TV 3.1.6
on:
  push:
    branches: [learning-island-family]
    paths: ['.github/workflows/learning-island-family-316.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed TV package and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LearningIsland-Family-TV-v3.1.6.apk
          zstd -qd --patch-from=LearningIsland-Family-TV-v3.1.5.apk release-staging/family-316/tv.zst -o "$apk"
          echo "350e1a6619e2789f885f0bb5b36db15471af8b3e352b971da38e1b7e72ad1c73  $apk" | sha256sum -c -
          test "$(jq -r .versionCode tv.json)" -le 316
          cp release-staging/family-316/tv.json tv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$apk" tv.json
          git commit -m "Publish signed TV v3.1.6 with Dudu Space"
          git push origin HEAD:learning-island-family
          gh release create learning-island-family-v3.1.6 "$apk" --target "$(git rev-parse HEAD)" --latest=false --title "邊看邊學電視版 v3.1.6" --notes "重繪航行障礙、降低遭遇頻率、新增船體血條、家庭表情及四人艙外救援。"
