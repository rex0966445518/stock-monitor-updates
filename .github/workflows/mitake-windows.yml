name: Build Mitake Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/MitakeDetector/**'
      - '.github/workflows/mitake-windows.yml'
  pull_request:
    paths:
      - 'windows/MitakeDetector/**'
      - '.github/workflows/mitake-windows.yml'

permissions:
  contents: read

concurrency:
  group: mitake-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows/MitakeDetector
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/MitakeDetector/requirements.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip freeze | Out-File -Encoding utf8 build-dependencies.txt
      - name: Verify source and updater
        run: |
          python -m py_compile MitakeDetector.py updater.py smoke_test.py build_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed' }
          python MitakeDetector.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          python -m unittest -v test_updater
          if ($LASTEXITCODE -ne 0) { throw 'Update validation tests failed' }
          python -c "from build_release import version; print('MITAKE_VERSION='+version())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python MitakeDetector.py --smoke-test release-output/source-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Source OCR/GUI smoke test failed' }
      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --collect-all rapidocr_onnxruntime --collect-all onnxruntime --name MitakeDetector MitakeDetector.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
      - name: Verify actual EXE and bundled OCR
        run: |
          $report = Join-Path (Get-Location) 'release-output/frozen-smoke.json'
          $exe = Join-Path (Get-Location) 'dist/MitakeDetector.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$report`"") -PassThru
          if (-not $proc.WaitForExit(240000)) { $proc.Kill(); throw 'Frozen EXE smoke test timed out' }
          $proc.Refresh()
          if ($proc.ExitCode -ne 0) { throw "Frozen EXE exit code: $($proc.ExitCode)" }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $data.ok -or -not $data.frozen -or $data.ocr_rows -ne 2) { throw 'Frozen EXE verification failed' }
          Get-Content $report
      - name: Build EXE installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $iscc "/DAppVersion=$env:MITAKE_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          python build_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest generation failed' }
      - name: Verify installation and update preserve settings
        run: |
          $installer = Join-Path (Get-Location) "release-output/MitakeDetector-Setup-v$env:MITAKE_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'MitakeDetectorInstall'
          $installLog = Join-Path (Get-Location) 'release-output/install.log'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$installDir`"", "/LOG=`"$installLog`"")
          $proc = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed: $($proc.ExitCode)" }
          $installedExe = Join-Path $installDir 'MitakeDetector.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed EXE missing' }
          if ((Get-FileHash $installedExe).Hash -ne (Get-FileHash 'dist/MitakeDetector.exe').Hash) { throw 'Installed EXE hash mismatch' }
          $settings = Join-Path $env:LOCALAPPDATA 'MitakeDetector/settings.json'
          $db = Join-Path $env:LOCALAPPDATA 'MitakeDetector/observations.sqlite3'
          $settingsHash = (Get-FileHash $settings).Hash
          $dbHash = (Get-FileHash $db).Hash
          $proc = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw 'Reinstall/update simulation failed' }
          if ((Get-FileHash $settings).Hash -ne $settingsHash -or (Get-FileHash $db).Hash -ne $dbHash) { throw 'Update changed user data' }
          $report = Join-Path (Get-Location) 'release-output/installed-smoke.json'
          $proc = Start-Process -FilePath $installedExe -ArgumentList @('--smoke-test',"`"$report`"") -PassThru
          if (-not $proc.WaitForExit(240000)) { $proc.Kill(); throw 'Installed EXE timed out' }
          $proc.Refresh()
          if ($proc.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed EXE failed' }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $data.ok -or -not $data.frozen) { throw 'Installed OCR/GUI test failed' }
          'Installation, reinstallation, data preservation and installed EXE verified.'
      - name: Preserve installer and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MitakeDetector-Windows-build
          path: |
            windows/MitakeDetector/release-output/*
            windows/MitakeDetector/build-dependencies.txt
            windows/MitakeDetector/build/MitakeDetector/warn-MitakeDetector.txt
          if-no-files-found: warn
      - name: Publish verified version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "mitake-v$env:MITAKE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This version already exists; increment VERSION before publishing.' }
          gh release create $tag "release-output/MitakeDetector-Setup-v$env:MITAKE_VERSION.exe" release-output/mitake-update.json release-output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "三竹盤中轉強偵測器 v$env:MITAKE_VERSION" --notes-file RELEASE_NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Version release failed' }
          python verify_public.py version
          if ($LASTEXITCODE -ne 0) { throw 'Published installer verification failed; stable feed not updated' }
          gh release view mitake-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload mitake-latest "release-output/MitakeDetector-Setup-v$env:MITAKE_VERSION.exe" release-output/mitake-update.json release-output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create mitake-latest "release-output/MitakeDetector-Setup-v$env:MITAKE_VERSION.exe" release-output/mitake-update.json release-output/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '三竹盤中轉強偵測器 Windows 最新版' --notes-file RELEASE_NOTES.md --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Stable feed publishing failed' }
          gh release edit mitake-latest --repo $env:GITHUB_REPOSITORY --title "三竹盤中轉強偵測器 Windows v$env:MITAKE_VERSION" --notes-file RELEASE_NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Stable release metadata update failed' }
          python verify_public.py stable
          if ($LASTEXITCODE -ne 0) { throw 'Stable update feed verification failed' }
