plugins { id 'com.android.application' }
android {
    namespace 'com.rex.mitakecompanion'
    compileSdk 35
    defaultConfig { applicationId 'com.rex.mitakecompanion'; minSdk 26; targetSdk 35; versionCode 12; versionName '0.1.11' }
    signingConfigs {
        companionBeta {
            storeFile rootProject.file('../TWBoardingScanner/signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.companionBeta } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
