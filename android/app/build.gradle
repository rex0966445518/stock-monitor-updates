plugins { id 'com.android.application' }
android {
    namespace 'tw.radar.shortscan'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'tw.radar.shortscan'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.3.0' }
    signingConfigs {
        if (System.getenv('RADAR_SIGN_PATH')) {
            persistent {
                storeFile file(System.getenv('RADAR_SIGN_PATH'))
                storePassword System.getenv('RADAR_SIGN_PASSWORD')
                keyAlias System.getenv('RADAR_SIGN_ALIAS')
                keyPassword System.getenv('RADAR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('RADAR_SIGN_PATH')) signingConfig signingConfigs.persistent
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
